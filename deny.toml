# cargo-deny config (security model T12). Run: cargo deny check
[graph]
all-features = false

[advisories]
# Fail on known vulnerabilities; unmaintained crates are reported for review.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses compatible with shipping Corral under MIT.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0",
  "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"   # Tauri's tree has many duplicates; revisit after M8
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
