# Corral CI. Mirrors `just check`. See docs/04-test-plan.md and docs/06-loop-engineering.md.
#
# Hardening (adversarial review, 2026-11-07):
# - Every run step uses bash with -eo pipefail, so a failing command in a pipeline fails the step.
# - Third-party actions are pinned to full commit SHAs (security model T12). Dependabot bumps them.
# - The Rust toolchain comes from rust-toolchain.toml (pinned), so a new stable clippy can't turn
#   unrelated PRs red.
# - Loop-integrity checks run the BASE commit's copy of their inputs: the scope guard script and
#   the eval baseline. A PR can't weaken the checks that judge it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs: a new push cancels the PR's older run. Pushes to main: one group per commit, so no run is
# ever cancelled or replaced while queued, and every commit on main gets a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, typecheck, eslint)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: cargo fmt --all -- --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      # The Tauri shell embeds the built frontend, so build it before clippy compiles the workspace.
      - run: pnpm -r build
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (Rust + TS)
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: cargo test --workspace
      - run: pnpm -r test

  eval-gate:
    name: eval gate + CI script tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -q -p corral-evals
      - name: CI script tests (TP-CI-*)
        run: scripts/ci/tests/run.sh
      - name: eval gate (baseline from the base commit)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CORRAL_EVALS_BIN: target/debug/corral-evals
        run: scripts/ci/eval_gate.sh "$BASE"

  native:
    name: native (CorralNative, Swift)
    # Needs Xcode 26 / the macOS 26 SDK (deployment target macOS 26).
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild test -scheme CorralNative-Package -destination 'platform=macOS'
        working-directory: native/CorralNative
      # The desktop playground (docs/07, Spike S5/S6) must keep compiling against the library.
      - run: xcodebuild build -scheme CorralPlayground -destination 'platform=macOS'
        working-directory: native/CorralNative

  scope-guard:
    name: scope guard (test changes need a reason)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: run the base commit's guard against this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git show "$BASE:scripts/ci/scope_guard.sh" > "$RUNNER_TEMP/scope_guard.sh"
          bash "$RUNNER_TEMP/scope_guard.sh" "$BASE"

  security:
    name: security (cargo-deny, pnpm audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { arguments: --workspace }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No `cache: pnpm` here: this job never installs packages, so there is no store to save and
      # setup-node's post step would fail the job ("Path Validation Error").
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
