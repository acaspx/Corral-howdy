[package]
name = "corral-store"
description = "The append-only, hash-chained SQLite event store and its projections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
corral-core = { path = "../corral-core" }
# Bundled SQLite: the same, known version everywhere, no system library needed.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
# The supervisor integration test runs on a tokio runtime.
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
