[package]
name = "corral-evals"
description = "Runs Corral's eval suites (docs/05-evals.md) and compares results against a baseline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
corral-adapters = { path = "../corral-adapters" }
corral-core = { path = "../corral-core" }
corral-policy = { path = "../corral-policy" }
corral-tools = { path = "../corral-tools" }
# Scenarios run on a paused clock (test-util), so checkpoint timeouts pass instantly.
tokio = { version = "1", features = ["rt", "time", "test-util"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true

[lints]
workspace = true
