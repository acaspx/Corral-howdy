[package]
name = "corral-adapters"
description = "The `AgentAdapter` trait and every adapter: native, managed, ACP, A2A, fake."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
corral-core = { path = "../corral-core" }
corral-policy = { path = "../corral-policy" }
corral-tools = { path = "../corral-tools" }
corral-secrets = { path = "../corral-secrets" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# HTTPS to model providers. native-tls is Security.framework on macOS (the system trust store,
# no bundled crypto); rustls' default provider pulls aws-lc-sys, whose license deny.toml refuses.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2"] }
# Sign in with ChatGPT (ADR-017): random state, nonce and PKCE, SHA-256 for the challenge, and
# RS256 checks of OpenAI's ID tokens against its published keys. ring is Apache-2.0 AND ISC.
ring = "0.17"
base64 = "0.23"
# Form-encoded OAuth requests and the loopback callback's query.
url = "2"
# Wipes codes, verifiers and tokens from memory when they're dropped.
zeroize = "1.9"
# TypeScript declarations for the main window (TP-IPC-06), only for the desktop app's build.
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]
# Test hooks (a fixed sign-in nonce), only for this crate's own tests: never in the app.
test-support = []

[dev-dependencies]
corral-adapters = { path = ".", features = ["test-support"] }
# Paused time: backoff and Stop are tested exactly without waiting.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
