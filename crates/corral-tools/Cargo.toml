[package]
name = "corral-tools"
description = "The tool gateway: filesystem sandbox and MCP client. Every call requires a policy Allow token."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
corral-core = { path = "../corral-core" }
corral-policy = { path = "../corral-policy" }
serde_json.workspace = true
thiserror.workspace = true
# Checkpoints wait for an answer, a timeout or Stop.
tokio = { version = "1", features = ["sync", "time", "macros"] }
# The filesystem sandbox opens everything beneath a directory handle, so a path can't escape the
# agent's folder through `..` or a symlink, even if the folder changes under it (TOCTOU).
cap-std = "4"
# Names are compared case- and normalization-insensitively, as APFS does (TP-FS-06..07).
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
