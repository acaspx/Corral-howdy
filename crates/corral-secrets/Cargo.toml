[package]
name = "corral-secrets"
description = "Provider API keys in the macOS Keychain: read at call time, never logged, never returned whole."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Wipes key bytes from memory when they're dropped (docs/01 §11: "zeroized after use").
zeroize = "1.9"
# TypeScript declarations for the main window (TP-IPC-06), only for the desktop app's build.
ts-rs = { version = "12.0.1", optional = true }

[features]
ts = ["dep:ts-rs"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
