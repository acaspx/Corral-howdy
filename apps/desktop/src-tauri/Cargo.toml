[package]
name = "corral-desktop"
description = "Corral's thin Tauri shell: windows, tray, hotkeys and IPC wiring. No decisions live here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "corral_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Link CorralNative (Swift) and show the corral (ADR-001). macOS + Xcode 26 only.
native = ["dep:swift-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Builds the CorralNative Swift package and links it with the Swift runtime (ADR-001).
swift-rs = { version = "1.0.7", features = ["build"], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
corral-core = { path = "../../../crates/corral-core" }
corral-secrets = { path = "../../../crates/corral-secrets" }
# Grok over xAI and the event store, for the walking skeleton's corral (SK-6).
corral-adapters = { path = "../../../crates/corral-adapters" }
corral-store = { path = "../../../crates/corral-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The workspace lints, except `unsafe_code` is `deny` instead of `forbid`, so the one FFI module
# (`src/native.rs`) can allow it. ADR-001 is the ADR that allows it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
wildcard_enum_match_arm = "warn"
dbg_macro = "deny"
todo = "warn"

[dev-dependencies]
serde_json = { workspace = true }
# Async tests for the key check (tests/connect.rs).
tokio = { version = "1", features = ["macros", "rt"] }
