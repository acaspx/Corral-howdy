# The UI test proof (Spike S2, step 4): a tiny app and its XCUITest, generated into an Xcode
# project by XcodeGen in the nightly workflow (.github/workflows/ui-nightly.yml). It answers one
# question before the nightly drives the bundled Corral app: can a GitHub-hosted macos-26 runner
# run a macOS UI test, in a window and in a non-activating panel like the corral's?
name: CorralUIProof
options:
  bundleIdPrefix: app.corral.proof
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed to run locally: nothing here is shipped.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  CorralUIProof:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corral.proof
        INFOPLIST_KEY_CFBundleDisplayName: Corral UI proof
  CorralUIProofUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: CorralUIProof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corral.proof.uitests
        TEST_TARGET_NAME: CorralUIProof
schemes:
  CorralUIProof:
    build:
      targets:
        CorralUIProof: all
        CorralUIProofUITests: [test]
    test:
      targets: [CorralUIProofUITests]
